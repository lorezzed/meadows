# Continuous integration + deploy:
#   * test    — compile the PureScript backend, run the full test battery, and
#               typecheck the frontend, on every push to main and every PR.
#   * deploy  — build the static site and publish it to GitHub Pages, only on
#               push to main and only after `test` passes.
#
# The toolchain (purescript, spago, node 22, esbuild) is pinned by flake.nix, so
# CI just installs Nix and runs everything INSIDE `nix develop`. That matters:
# the Makefile's `node test/*.mjs` lines invoke `node` directly (not wrapped in
# `nix develop`), so they need the nix-provided node on PATH — running the whole
# `make test` / `make dist` inside one `nix develop` supplies it. Entering the
# dev shell also runs its shellHook (`npm install`) for the d3/esbuild deps.
#
# GitHub Pages must be enabled once, by hand: repo Settings -> Pages -> Build and
# deployment -> Source -> "GitHub Actions". The site then serves at
# https://lorezzed.github.io/meadows/ (index.html loads ./index.js relatively,
# so the /meadows/ subpath works with no base-path config).
#
# Speed-up follow-up: add a Nix store cache (e.g. FlakeHub Cache, or
# nix-community/cache-nix-action) so the toolchain isn't re-fetched each run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege GITHUB_TOKEN by default; the deploy job widens it for Pages.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix (flakes enabled)
        uses: DeterminateSystems/nix-installer-action@main

      # spago build -> spago test (unit checks) -> golden battery ->
      # simulate / highlight / format / layout headless suites.
      - name: make test
        run: nix --experimental-features 'nix-command flakes' develop --command make test

      # Frontend type-check (tsconfig has noEmit); not part of `make test`.
      - name: Typecheck frontend (tsc)
        run: nix --experimental-features 'nix-command flakes' develop --command npx tsc

  deploy:
    needs: test
    # Publish only when main advances — never on PRs or other branches.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # to publish to Pages
      id-token: write # to let deploy-pages verify the deployment origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Serialize Pages deploys; don't cancel an in-flight publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix (flakes enabled)
        uses: DeterminateSystems/nix-installer-action@main

      # spago build -> esbuild bundle ui/index.js (minified, self-contained) +
      # the HTML shell, into ./dist.
      - name: Build static site (make dist -> ./dist)
        run: nix --experimental-features 'nix-command flakes' develop --command make dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload ./dist as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
