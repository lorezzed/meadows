name: PureScript CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Nix
      uses: cachix/install-nix-action@v22
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true
    
    - name: Setup Cachix
      uses: cachix/cachix-action@v12
      with:
        name: your-cachix-name  # Optional: Create account at cachix.org
        skipPush: true
    
    - name: Check Nix Flake
      run: |
        nix flake check
        nix flake show
    
    - name: Build Development Shell
      run: nix develop -c echo "Development shell OK"
    
    - name: Install Dependencies
      run: nix develop -c spago install
    
    - name: Format Check
      run: |
        nix develop -c purs-tidy check src/**/*.purs
        nix develop -c purs-tidy check test/**/*.purs
      continue-on-error: true  # Make this required once formatting is consistent
    
    - name: Build Project
      run: nix develop -c spago build
    
    - name: Run Tests
      run: nix develop -c spago test
    
    - name: Generate Documentation
      run: nix develop -c spago docs
    
    - name: Bundle Application
      run: nix develop -c spago bundle-app --main Main --to dist/app.js
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: purescript-app
        path: |
          dist/
          generated-docs/
    
    # Optional: Build with different PureScript versions
    matrix-build:
      if: github.event_name == 'pull_request'
      strategy:
        matrix:
          purs-version: ['0.15.13', '0.15.14', '0.15.15']
      runs-on: ubuntu-latest
      
      steps:
      - uses: actions/checkout@v3
      
      - name: Install Nix
        uses: cachix/install-nix-action@v22
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      
      - name: Build with PureScript ${{ matrix.purs-version }}
        run: |
          # You would need to parameterize your flake to accept version input
          echo "Building with PureScript ${{ matrix.purs-version }}"
          nix develop -c spago build

  # Optional: Deploy job
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Download Artifacts
      uses: actions/download-artifact@v3
      with:
        name: purescript-app
    
    - name: Deploy to GitHub Pages
      if: success()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./generated-docs
        
    # Add your deployment steps here
    # - Deploy to server
    # - Push to CDN
    # - Update Docker image
    # etc.
